<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pong the turtle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{size}}px; height: {{size}}px; position: relative">
<svg viewBox="0 0 120 120" width="100%" height="100%" role="img" aria-label="{{label}}" style="display: block; overflow: visible">
<ellipse cx="9" cy="90" rx="7" ry="3.6" fill="#8CBF7E" transform="rotate(-25 9 90)"></ellipse>
<ellipse cx="24" cy="97" rx="10" ry="6.5" fill="#8CBF7E"></ellipse>
<ellipse cx="74" cy="97" rx="10" ry="6.5" fill="#8CBF7E"></ellipse>
<g transform="{{headT}}">
<path d="M68 88 C74 78 82 71 90 68 L101 77 C93 83 85 89 79 96 Z" fill="#A9D69B"></path>
<circle cx="98" cy="60" r="18" fill="#A9D69B"></circle>
<ellipse cx="98" cy="68" rx="11" ry="6.5" fill="#BEE2B1"></ellipse>
<g opacity="{{openEyes}}">
<ellipse cx="91" cy="57" rx="3.6" ry="4.4" fill="#22301F"></ellipse>
<ellipse cx="105" cy="57" rx="3.6" ry="4.4" fill="#22301F"></ellipse>
<circle cx="92.2" cy="55.4" r="1.3" fill="#FFFFFF"></circle>
<circle cx="106.2" cy="55.4" r="1.3" fill="#FFFFFF"></circle>
</g>
<g opacity="{{closedEyes}}" stroke="#22301F" stroke-width="2.3" fill="none" stroke-linecap="round">
<path d="M87 57 Q91 61 95 57"></path>
<path d="M101 57 Q105 61 109 57"></path>
</g>
<g opacity="{{happyEyes}}" stroke="#22301F" stroke-width="2.5" fill="none" stroke-linecap="round">
<path d="M87 59 Q91 53 95 59"></path>
<path d="M101 59 Q105 53 109 59"></path>
</g>
<g opacity="{{drowsyEyes}}">
<ellipse cx="91" cy="58.5" rx="3.6" ry="1.9" fill="#22301F"></ellipse>
<ellipse cx="105" cy="58.5" rx="3.6" ry="1.9" fill="#22301F"></ellipse>
<path d="M86.5 56.6 H95.5 M100.5 56.6 H109.5" stroke="#6E9E62" stroke-width="2.3" stroke-linecap="round"></path>
</g>
<ellipse cx="85.5" cy="65" rx="5" ry="3.2" fill="#F09A8A" opacity="0.6"></ellipse>
<ellipse cx="110.5" cy="65" rx="5" ry="3.2" fill="#F09A8A" opacity="0.6"></ellipse>
<path d="M94 68 Q98 72.5 102 68" stroke="#22301F" stroke-width="2.1" fill="none" stroke-linecap="round" opacity="{{smile}}"></path>
<ellipse cx="98" cy="69.5" rx="3.6" ry="3" fill="#4A2A24" opacity="{{talk}}"></ellipse>
</g>
<path d="M6 90 C6 58 27 40 50 40 C73 40 94 58 94 90 Z" fill="#5E9E6E"></path>
<ellipse cx="50" cy="63" rx="15" ry="12" fill="#7DB88A"></ellipse>
<ellipse cx="24" cy="79" rx="9" ry="8" fill="#7DB88A"></ellipse>
<ellipse cx="76" cy="79" rx="9" ry="8" fill="#7DB88A"></ellipse>
<ellipse cx="50" cy="84" rx="8" ry="4.5" fill="#7DB88A"></ellipse>
<path d="M20 62 C24 53 32 47 40 45" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.35"></path>
<rect x="2" y="86" width="96" height="10" rx="5" fill="#3F7350"></rect>
<g opacity="{{sprout}}">
<circle cx="50" cy="31" r="3.4" fill="#F5B83D"></circle>
<circle cx="54.8" cy="34.5" r="3.4" fill="#F5B83D"></circle>
<circle cx="53" cy="40" r="3.4" fill="#F5B83D"></circle>
<circle cx="47" cy="40" r="3.4" fill="#F5B83D"></circle>
<circle cx="45.2" cy="34.5" r="3.4" fill="#F5B83D"></circle>
<circle cx="50" cy="36" r="2.6" fill="#E09A1E"></circle>
</g>
<g opacity="{{zz}}" fill="#2F7F7A" font-family="Fredoka, Nunito, sans-serif" font-weight="700">
<text x="66" y="32" font-size="13">z</text>
<text x="77" y="21" font-size="9">z</text>
</g>
<g opacity="{{sparkle}}" fill="#F5B83D">
<path d="M12 30 L14.6 36.4 L21 39 L14.6 41.6 L12 48 L9.4 41.6 L3 39 L9.4 36.4 Z"></path>
<path d="M78 22 L80 26.8 L84.8 28.8 L80 30.8 L78 35.6 L76 30.8 L71.2 28.8 L76 26.8 Z"></path>
<path d="M114 26 L115.2 29 L118.2 30.2 L115.2 31.4 L114 34.4 L112.8 31.4 L109.8 30.2 L112.8 29 Z"></path>
</g>
<g opacity="{{notice}}" stroke="#E09A1E" stroke-width="3" stroke-linecap="round">
<path d="M110 38 L115 31"></path>
<path d="M116 46 L121 44"></path>
<path d="M86 36 L82 29"></path>
</g>
<g opacity="{{dots}}" fill="#2F7F7A">
<circle cx="104" cy="34" r="2.5"></circle>
<circle cx="111" cy="29" r="2.5"></circle>
<circle cx="118" cy="24" r="2.5"></circle>
</g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["sleep","peek","ask","listen","happy","snooze"],"default":"sleep"},"size":{"editor":"int","min":16,"max":400,"default":160},"sprout":{"editor":"boolean","default":true},"$preview":{"width":160,"height":160}}'>
class Component extends DCLogic {
  renderVals() {
    const mood = this.props.mood ?? 'sleep';
    const is = (list) => (list.indexOf(mood) !== -1 ? 1 : 0);
    const labels = {
      sleep: 'Pong napping in his shell', peek: 'Pong peeking out of his shell', ask: 'Pong asking what you are up to',
      listen: 'Pong listening', happy: 'Pong happy', snooze: 'Pong drowsy'
    };
    const HEAD = {
      sleep: 'translate(-34 8)',
      snooze: 'translate(-13 5)',
      peek: 'translate(-10 4)',
      ask: 'translate(2 -4)',
      listen: 'translate(0 -2) rotate(-9 98 60)',
      happy: 'translate(0 -3)'
    };
    return {
      size: this.props.size ?? 160,
      label: labels[mood] || 'Pong the turtle',
      headT: HEAD[mood] || HEAD.sleep,
      openEyes: is(['peek', 'ask', 'listen']),
      closedEyes: is(['sleep']),
      happyEyes: is(['happy']),
      drowsyEyes: is(['snooze']),
      smile: is(['sleep', 'peek', 'listen', 'happy', 'snooze']),
      talk: is(['ask']),
      zz: is(['sleep', 'snooze']),
      sparkle: is(['happy']),
      notice: is(['peek', 'ask']),
      dots: is(['listen']),
      sprout: (this.props.sprout ?? true) ? 1 : 0
    };
  }
}
</script>
</body>
</html>
